<script>

    var elem = document.getElementById('terminal');

window.setInterval(function () {
  elem.scrollTo({ top: elem.scrollHeight, behavior: 'smooth' });
}, 50);

  const queue = [
    { el: document.getElementById("header"), text: "Mission Briefing", pause: 1000},
    { el: document.getElementById("line1"), text: " ", pause: 1000},
    { el: document.getElementById("line2"), text: "You're an intelligence officer for the military working in the pentagon (Circa. 2036).\n", pause: 1000 },
    { el: document.getElementById("line3"), text: "A Cranbrook dorm student just broke national security to access a database they wanted to use for their pet project in Cybersecurity.", pause: 1000 },

{ el: document.getElementById("line4"), text: " ", pause: 1000 },

{ el: document.getElementById("line5"), text: "So, you need images of Cranbrook Schools to locate possible places the student would be located during the school day. You have 8 hours to find the student and eliminate them with an Air-to-Ground Cruise Missile.", pause: 1000 },

{ el: document.getElementById("line6"), text: "Typically, an intelligence officer is given weeks to work on gathering data and following chain of command to make sure the proper precautions are taken. Even in the use of AI, they'd typically be told to:", pause: 1000 },

{ el: document.getElementById("line7"), text: " ", pause: 1000 },

{ el: document.getElementById("line8"), text: "1. Check the database", pause: 1000 },

{ el: document.getElementById("line9"), text: "2. Confirm Target", pause: 1000 },

{ el: document.getElementById("line10"), text: "3. Damage Control and Mitigation Briefing", pause: 1000 },

{ el: document.getElementById("line11"), text: "4. Confirm with Chain-of-Command", pause: 1000 },

{ el: document.getElementById("line12"), text: "5. Confirm Authorization to Eliminate Target", pause: 1000 },

{ el: document.getElementById("line13"), text: "6. Confirm Target Identity and Location (again)", pause: 1000 },

{ el: document.getElementById("line14"), text: "7. Confirm with Ballistics and Chain-of-Command", pause: 1000 },

{ el: document.getElementById("line15"), text: "8. Eliminate Target", pause: 1000 },

{ el: document.getElementById("line16"), text: " ", pause: 1000 },

{ el: document.getElementById("line17"), text: "But because you were given 8 hours. Your steps will look more like this:", pause: 1000 },

{ el: document.getElementById("line18"), text: " ", pause: 1000 },

{ el: document.getElementById("line19"), text: "1. Ooh shiny new Palantir Maven Smart System update?", pause: 1000 },

{ el: document.getElementById("line20"), text: "2. Confirm Target (Kinda?)", pause: 1000 },

{ el: document.getElementById("line21"), text: "3. Palantir's MSS checks database of locations through Claude, asks for authorization to choose a location", pause: 1000 },

{ el: document.getElementById("line22"), text: "4. Yeah sure bro idc. (The database is from a decade ago)", pause: 1000 },

{ el: document.getElementById("line23"), text: "5. Eliminate Target Y/N?", pause: 0 },

//{ el: document.getElementById("line24"), text: "6. Yes bro. Y", pause: 1000 },

//{ el: document.getElementById("line25"), text: "7. Target Eliminated (probably?)", pause: 1000 },

//{ el: document.getElementById("line26"), text: "8. Press release exposes that 30 students in the Cranbrook Quad were just put in the hospital in critical condition.", pause: 0 }


  ];

  let queueIndex = 0;
  let charIndex = 0;

  function typeNext() {
  if (queueIndex >= queue.length) return;

  const current = queue[queueIndex];

  if (charIndex < current.text.length) {
    current.el.textContent += current.text.charAt(charIndex);
    charIndex++;
    setTimeout(typeNext, 20);
  } else {
    queueIndex++;
    charIndex = 0;
    setTimeout(typeNext, current.pause);
  }
}
  // Only start typing when the system starts
  


</script>

    
    
    
    <audio id="music" loop>
        <source src="06. Encounter.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startSystem() {
            const music = document.getElementById("music");

            music.addEventListener("playing", function() {
                setTimeout(function() {
                    typeNext();
                }, 1150);
            }, { once: true });

            music.play();
        }
    </script>

</body>

</html>
